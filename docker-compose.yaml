version: '3.8'
services:
  db-mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=root
      - MYSQL_ROOT_PASSWORD=TranDuc123!
    ports:
      - 3307:3306
    expose:
      - 3306
  backend:
    image: tranxuanduc/cd3-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_PORT=3306
      - DB_HOST=db-mysql
    ports:
      - 3000:3000
    expose:
      - 3000
  nginx:
    image: tranxuanduc/cd3-nginx:latest
    env_file:
      - ./nginx/.env
    ports:
      - 5173:80
    depends_on:
      - backend
    expose:
      - 80