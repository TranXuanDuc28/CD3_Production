version: '3.8'
services:
  db-mysql:
    image: mysql:8.0
    restart: always
    environment:
      - MYSQL_DATABASE=root
      - MYSQL_ROOT_PASSWORD=TranDuc123!
    ports:
      - 3307:3306
    expose:
      - 3306
  backend:
    build:
      context: ../backend/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DB_PORT=3306
      - DB_HOST=db-mysql
      - CLIENT_URL=http://localhost
    ports:
      - 3000:3000
    expose:
      - 3000
  nginx:
    image: nginx:1.23.3
    ports:
      - 80:80
    volumes:
      - ../frontend/dist:/usr/share/nginx/html
      - ./default.conf:/etc/nginx/conf.d/default.conf