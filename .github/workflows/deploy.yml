name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy (backend/frontend)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show inputs
        run: |
          echo "Deploying service: ${{ github.event.inputs.service }}"

      - name: SSH to server and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/tranduc/CD3_Production
            echo "Pulling latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/cd3-${{ github.event.inputs.service }}:latest
            echo "Restarting service..."
            docker-compose up -d --force-recreate --remove-orphans ${{ github.event.inputs.service }}
            echo "Deployment completed."