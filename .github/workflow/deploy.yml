name: Deploy Production

on:
  inputs:
      service:
        description: 'Service to deploy (backend/frontend)'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/tranduc/CD3_Production
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/cd3-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/cd3-frontend:latest
            # Restart containers
            docker-compose up -d
            echo "Deployed ${{ github.event.inputs.service }} successfully!"
